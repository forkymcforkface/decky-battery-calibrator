[project]
name = "decky-battery-calibrator"
version = "0.1.0"
description = "Battery charge limiter with periodic calibration cycles for Steam Deck"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "basic"
reportMissingModuleSource = false
reportMissingImports = false
exclude = ["dist", "node_modules", ".git", "**/node_modules"]
